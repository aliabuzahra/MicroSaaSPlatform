#version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: saas-platform-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: saas_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: saas-platform-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: saas-platform-redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity-service:
    build:
      context: .
      dockerfile: apps/services/identity/Dockerfile
    container_name: saas-platform-identity
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=saas_identity;Username=postgres;Password=postgrespassword
      - RabbitMQ__Host=rabbitmq
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Secret=super-secret-key-for-jwt-token-generation-minimum-32-chars
      - Jwt__Issuer=SaaS.Identity
      - Jwt__Audience=SaaS.Platform
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  tenant-service:
    build:
      context: .
      dockerfile: apps/services/tenant/Dockerfile
    container_name: saas-platform-tenant
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=saas_tenant;Username=postgres;Password=postgrespassword
      - RabbitMQ__Host=rabbitmq
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  billing-service:
    build:
      context: .
      dockerfile: apps/services/billing/Dockerfile
    container_name: saas-platform-billing
    ports:
      - "5003:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=saas_billing;Username=postgres;Password=postgrespassword
      - RabbitMQ__Host=rabbitmq
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - Paddle__WebhookSecret=paddle_secret_test_123
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  notifications-service:
    build:
      context: .
      dockerfile: apps/services/notifications/Dockerfile
    container_name: saas-platform-notifications
    ports:
      - "5004:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=saas_notifications;Username=postgres;Password=postgrespassword
      - RabbitMQ__Host=rabbitmq
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - Smtp__Enabled=false
      - App__BaseUrl=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  audit-service:
    build:
      context: .
      dockerfile: apps/services/audit/Dockerfile
    container_name: saas-platform-audit
    ports:
      - "5005:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=saas_audit;Username=postgres;Password=postgrespassword
      - RabbitMQ__Host=rabbitmq
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  apikeys-service:
    build:
      context: .
      dockerfile: apps/services/apikeys/Dockerfile
    container_name: saas-platform-apikeys
    ports:
      - "5006:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=saas_apikeys;Username=postgres;Password=postgrespassword
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Secret=super-secret-key-for-jwt-token-generation-minimum-32-chars
      - Jwt__Issuer=SaaS.Identity
      - Jwt__Audience=SaaS.Platform
    depends_on:
      db:
        condition: service_healthy
    restart: always

  webhooks-service:
    build:
      context: .
      dockerfile: apps/services/webhooks/Dockerfile
    container_name: saas-platform-webhooks
    ports:
      - "5007:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=saas_webhooks;Username=postgres;Password=postgrespassword
      - RabbitMQ__Host=rabbitmq
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Secret=super-secret-key-for-jwt-token-generation-minimum-32-chars
      - Jwt__Issuer=SaaS.Identity
      - Jwt__Audience=SaaS.Platform
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  features-service:
    build:
      context: .
      dockerfile: apps/services/features/Dockerfile
    container_name: saas-platform-features
    ports:
      - "5008:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=saas_features;Username=postgres;Password=postgrespassword
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Secret=super-secret-key-for-jwt-token-generation-minimum-32-chars
      - Jwt__Issuer=SaaS.Identity
      - Jwt__Audience=SaaS.Platform
    depends_on:
      db:
        condition: service_healthy
    restart: always

  storage-service:
    build:
      context: .
      dockerfile: apps/services/storage/Dockerfile
    container_name: saas-platform-storage
    ports:
      - "5009:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=saas_storage;Username=postgres;Password=postgrespassword
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Secret=super-secret-key-for-jwt-token-generation-minimum-32-chars
      - Jwt__Issuer=SaaS.Identity
      - Jwt__Audience=SaaS.Platform
      - Storage__LocalPath=/data/storage
    volumes:
      - storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy
    restart: always

  config-service:
    build:
      context: .
      dockerfile: apps/services/config/Dockerfile
    container_name: saas-platform-config
    ports:
      - "5010:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=saas_config;Username=postgres;Password=postgrespassword
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Secret=super-secret-key-for-jwt-token-generation-minimum-32-chars
      - Jwt__Issuer=SaaS.Identity
      - Jwt__Audience=SaaS.Platform
    depends_on:
      db:
        condition: service_healthy
    restart: always

  gateway-service:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: saas-platform-gateway
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-service:8080
      - ReverseProxy__Clusters__tenant-cluster__Destinations__destination1__Address=http://tenant-service:8080
      - ReverseProxy__Clusters__billing-cluster__Destinations__destination1__Address=http://billing-service:8080
      - ReverseProxy__Clusters__notifications-cluster__Destinations__destination1__Address=http://notifications-service:8080
      - ReverseProxy__Clusters__audit-cluster__Destinations__destination1__Address=http://audit-service:8080
      - ReverseProxy__Clusters__apikeys-cluster__Destinations__destination1__Address=http://apikeys-service:8080
      - ReverseProxy__Clusters__webhooks-cluster__Destinations__destination1__Address=http://webhooks-service:8080
      - ReverseProxy__Clusters__features-cluster__Destinations__destination1__Address=http://features-service:8080
      - ReverseProxy__Clusters__storage-cluster__Destinations__destination1__Address=http://storage-service:8080
      - ReverseProxy__Clusters__config-cluster__Destinations__destination1__Address=http://config-service:8080
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=super-secret-key-for-jwt-token-generation-minimum-32-chars
      - Jwt__Issuer=SaaS.Identity
      - Jwt__Audience=SaaS.Platform
    depends_on:
      - identity-service
      - tenant-service
      - billing-service
      - notifications-service
      - audit-service
      - apikeys-service
      - webhooks-service
      - features-service
      - storage-service
      - config-service
      - redis
    restart: always

volumes:
  postgres_data:
  rabbitmq_data:
  storage_data:
